[package]
name = "neuroclip"
version = "1.0.0"
description = "NeuroClip — AI Clip & Subtitle Studio"
authors = ["NeuroClip Team"]
edition = "2021"

[lib]
name = "neuroclip_lib"
crate-type = ["rlib"]

[[bin]]
name = "neuroclip"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Disable `common-controls-v6` so `cargo test --lib` does not import `TaskDialogIndirect` (`0xc0000139`, since Cargo omits `rustc-link-arg-tests` on `--lib`); `neuroclip.exe` still embeds ComCtl32 v6 manifest via `tauri-build`.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sha2 = "0.10"
tract-onnx = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.tract-hir]
opt-level = 3

[profile.dev.package.tract-onnx]
opt-level = 3

[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
